<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#080808;color:#ddd;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}.back{position:fixed;top:24px;left:28px;z-index:10;color:#aaa;text-decoration:none;text-transform:uppercase;font-size:10px;letter-spacing:3px;padding:14px 18px;border:1px solid #222;background:rgba(8,8,8,.7);backdrop-filter:blur(12px);border-radius:10px;transition:color .2s,border-color .2s,transform .2s}.back:hover{color:#fff;border-color:#555;transform:translateX(-3px)}main{width:min(900px,92vw);text-align:center;padding:90px 20px}.label{font-size:9px;color:#555;letter-spacing:4px;text-transform:uppercase;margin-bottom:24px}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(60px,10vw,110px);line-height:.9;letter-spacing:-5px;margin:0 0 35px;color:#eee}.game-image{width:min(760px,100%);display:block;margin:0 auto 42px;border:1px solid #222;border-radius:14px;box-shadow:0 25px 80px rgba(0,0,0,.55);opacity:.94;transition:transform .45s ease,opacity .45s ease,box-shadow .45s ease}.game-image:hover{transform:scale(1.015);opacity:1;box-shadow:0 30px 100px rgba(0,0,0,.7)}.message{font-size:18px;line-height:1.9;color:#999;max-width:680px;margin:0 auto 12px}.note{font-size:15px;line-height:1.8;color:#666;max-width:600px;margin:0 auto}.fade{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:700px){.back{top:14px;left:14px;padding:12px 14px;font-size:8px}main{padding:90px 10px}.message{font-size:15px}h1{letter-spacing:-3px}.game-image{border-radius:10px;margin-bottom:32px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="back" href="https://123idkgames456.github.io/FNAJ/home/">← Back</a>
<main class="fade">
<div class="label">The Game</div>
<h1>Game</h1>
<img class="game-image" src="../Images/Bilde_2026-09-28_120044122.png" alt="Game image">
<p class="message">Game not out yet but Will be out on gamejolt in late 2026 or Early 2027</p>
<p class="note">Play tests might Come in Future so Stay tuned</p>
</main>
</body>
</html>
