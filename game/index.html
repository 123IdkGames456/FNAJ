<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#080808;color:#ddd;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.045),transparent 220px)}.back{position:fixed;top:24px;left:28px;z-index:10;color:#aaa;text-decoration:none;text-transform:uppercase;font-size:10px;letter-spacing:3px;padding:14px 18px;border:1px solid #222;background:rgba(8,8,8,.7);backdrop-filter:blur(12px);border-radius:10px;transition:color .2s,border-color .2s,transform .2s}.back:hover{color:#fff;border-color:#555;transform:translateX(-3px)}main{width:min(850px,90vw);text-align:center;padding:100px 20px}.label{font-size:9px;color:#555;letter-spacing:4px;text-transform:uppercase;margin-bottom:24px}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(60px,10vw,110px);line-height:.9;letter-spacing:-5px;margin:0 0 35px;color:#eee}.message{font-size:18px;line-height:1.9;color:#999;max-width:680px;margin:0 auto 12px}.note{font-size:15px;line-height:1.8;color:#666;max-width:600px;margin:0 auto}.fade{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:700px){.back{top:14px;left:14px;padding:12px 14px;font-size:8px}main{padding:90px 10px}.message{font-size:15px}h1{letter-spacing:-3px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="back" href="../home/index.html">← Back</a>
<main class="fade">
<div class="label">The Game</div>
<h1>Game</h1>
<p class="message">Game not out yet but Will be out on gamejolt in late 2026 or Early 2027</p>
<p class="note">Play tests might Come in Future so Stay tuned</p>
</main>
<script>
document.addEventListener('mousemove',e=>{document.body.style.setProperty('--mx',(e.clientX/innerWidth*100)+'%');document.body.style.setProperty('--my',(e.clientY/innerHeight*100)+'%')});
</script>
</body>
</html>
