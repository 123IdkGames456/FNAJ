<script>const menu=document.querySelector(".menu-toggle"),nav=document.querySelector("nav");menu?.addEventListener("click",()=>{const open=nav.classList.toggle("open");menu.setAttribute("aria-expanded",open);menu.textContent=open?"×":"☰"});nav?.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{nav.classList.remove("open");menu.setAttribute("aria-expanded","false");menu.textContent="☰"}));</script><script>const menu=document.querySelector('.menu-toggle'),nav=document.querySelector('.site-nav nav');menu?.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',open);menu.textContent=open?'×':'☰'});nav?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.textContent='☰'}));if(location.pathname.endsWith('/index.html'))history.replaceState(null,'',location.pathname.slice(0,-10));</script><script id="spaNavigation">(()=>{const routes=["/FNAJ/","/FNAJ/home/","/FNAJ/game/","/FNAJ/gallery/","/FNAJ/link-list/"];const cache={};const current=()=>{let p=location.pathname.replace(/index\.html$/,"");return p.endsWith("/")?p:p+"/"};async function preload(){for(const r of routes){if(r===current())continue;try{cache[r]=await fetch(r).then(x=>x.text())}catch(e){}}}function runScripts(root){root.querySelectorAll("script").forEach(old=>{if(old.id==="spaNavigation")return;const s=document.createElement("script");for(const a of old.attributes)s.setAttribute(a.name,a.value);s.textContent=old.textContent;old.replaceWith(s)})}async function go(url,replace){const u=new URL(url,location.href),p=u.pathname.replace(/index\.html$/,"").replace(/\/$/,"/")||"/";let html=cache[p];if(!html)try{html=await fetch(p).then(x=>x.text());cache[p]=html}catch(e){location.href=url;return}const doc=new DOMParser().parseFromString(html,"text/html");const styles=[...doc.head.querySelectorAll("style")].map(x=>x.outerHTML).join("");document.title=doc.title;document.head.querySelectorAll("[data-spa-style]").forEach(x=>x.remove());const holder=document.createElement("div");holder.innerHTML=styles;holder.querySelectorAll("style").forEach(x=>{x.dataset.spaStyle="1";document.head.appendChild(x)});document.body.classList.add("spa-out");setTimeout(()=>{document.body.innerHTML=doc.body.innerHTML;document.body.classList.remove("spa-out");document.body.classList.add("spa-in");runScripts(document.body);if(replace)history.replaceState({}, "",u.href);else history.pushState({}, "",u.href);setTimeout(()=>document.body.classList.remove("spa-in"),450)},180)}document.addEventListener("click",e=>{const a=e.target.closest("a");if(!a||a.target==="_blank"||a.hasAttribute("download")||a.origin!==location.origin)return;const p=new URL(a.href).pathname;if(!p.startsWith("/FNAJ/"))return;e.preventDefault();go(a.href,false)});window.addEventListener("popstate",()=>go(location.href,true));const st=document.createElement("style");st.textContent="body.spa-out{opacity:0;transition:opacity .18s ease}body.spa-in{animation:spaIn .4s ease}@keyframes spaIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}";document.head.appendChild(st);preload()})()</script></body>
