<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts — FNAJ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet"><link rel="stylesheet" href="../dropdown/style.css"><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#171611;color:#d9d2c2;font-family:Inter,Arial,sans-serif;padding:120px 22px 70px}main{max-width:1050px;margin:auto}.eyebrow{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#777164;margin-bottom:12px}.title{font:42px "Special Elite",serif;color:#e8e0cf;margin:0 0 12px}.intro{max-width:650px;color:#918a7c;font-size:13px;line-height:1.8;margin:0 0 42px}.contacts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#211f19;border:1px solid #3b382e;border-radius:8px;padding:18px;box-shadow:0 14px 40px #0007;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#5b5547}.portrait{width:100%;aspect-ratio:1/1;background:#2a2821;border:1px solid #3b382e;border-radius:6px;overflow:hidden;margin-bottom:18px;display:flex;align-items:center;justify-content:center;color:#70695b;font:34px "Special Elite",serif}.portrait img{width:100%;height:100%;object-fit:cover;display:block}.name{font:25px "Special Elite",serif;color:#e4dccb;margin-bottom:8px}.role{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#817969;line-height:1.7;min-height:34px}.description{color:#a59d8e;font-size:12px;line-height:1.7;margin:12px 0 0}.role-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.role-slot{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#a9a191;border:1px solid #403c32;background:#29271f;border-radius:4px;padding:5px 7px}.open-profile{margin-top:18px;width:100%;padding:11px 13px;border:1px solid #4b4639;border-radius:5px;background:#302d25;color:#cfc6b5;font:9px Inter,Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer}.open-profile:hover{background:#3a362c;color:#eee8d9}.modal{position:fixed;inset:0;background:#080806b8;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:200}.modal.open{display:flex}.profile{width:min(560px,100%);background:#211f19;border:1px solid #4a4538;border-radius:8px;box-shadow:0 25px 80px #000b;padding:22px;position:relative}.close{position:absolute;right:15px;top:13px;border:0;background:transparent;color:#8f887a;font-size:22px;cursor:pointer}.profile-grid{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:start}.profile .portrait{margin:0}.profile h2{font:30px "Special Elite",serif;color:#e8e0cf;margin:2px 0 10px}.profile p{color:#a59d8e;font-size:13px;line-height:1.8;margin:0}.profile .label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#716b5e;margin:15px 0 5px}@media(max-width:760px){body{padding:100px 15px 45px}.title{font-size:34px}.contacts{grid-template-columns:1fr}.card{display:grid;grid-template-columns:105px 1fr;column-gap:15px}.card .portrait{grid-row:1/4;margin:0}.card .name{margin-top:4px}.card .role{min-height:0}.card .open-profile{margin-top:12px}.profile-grid{grid-template-columns:95px 1fr;gap:15px}.profile h2{font-size:25px}}
</style></head><body><header><div class="site-nav"><a class="site-logo" href="../home/">FNAJ <span>FIVE NIGHTS AT JØLLE</span></a><div class="site-nav-wrap"><nav><div class="universal-dropdown" id="currentDropdown"><button class="universal-dropdown-toggle" type="button" aria-expanded="false">Contacts/contacts</button><div class="universal-dropdown-menu"><small>Home</small><a href="../home/">Home/home</a><a href="../home/#project">Home/project</a><a href="../home/#faq">Home/FAQ</a><a href="../home/#contact">Home/Contact</a><div class="nav-separator"></div><small>Game</small><a href="../game/">Game/game</a><div class="nav-separator"></div><small>Gallery</small><a href="../gallery/">Gallery/gallery</a><div class="nav-separator"></div><small>Links</small><a href="../link-list/">Links/links</a><div class="nav-separator"></div><small>Contacts</small><a href="../contacts/">Contacts/contacts</a></div></div></nav><button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">Contacts/contacts</button></div></div></header><main><div class="eyebrow">People behind the project</div><h1 class="title">Contacts</h1><p class="intro">The people helping build, shape and expand the project.</p><section class="contacts">
<article class="card"><div class="portrait"><img src="Images/Ikirumi.png" alt="Ikirumi" onerror="this.remove()"><span>IK</span></div><div class="name">Ikirumi</div><div class="role" data-role="ikirumi"></div><div class="description" data-description="ikirumi"></div><div class="role-list" data-roles="ikirumi"></div><button class="open-profile" data-profile="ikirumi">Open profile</button></article>
<article class="card"><div class="portrait"><img src="Images/Jolle.png" alt="Jølle" onerror="this.remove()"><span>JØ</span></div><div class="name">Jølle</div><div class="role" data-role="jolle"></div><div class="description" data-description="jolle"></div><div class="role-list" data-roles="jolle"></div><button class="open-profile" data-profile="jolle">Open profile</button></article>
<article class="card"><div class="portrait"><img src="Images/Kurs.png" alt="Kurs" onerror="this.remove()"><span>KU</span></div><div class="name">Kurs</div><div class="role" data-role="kurs"></div><div class="description" data-description="kurs"></div><div class="role-list" data-roles="kurs"></div><button class="open-profile" data-profile="kurs">Open profile</button></article>
</section></main><div class="modal" id="profileModal"><div class="profile"><button class="close" id="closeProfile" aria-label="Close profile">×</button><div class="profile-grid"><div class="portrait" id="profilePortrait"></div><div><h2 id="profileName"></h2><div class="label">Description</div><p id="profileContribution"></p><div class="label">Roles</div><div class="role-list" id="profileRoles"></div></div></div></div></div><script src="../dropdown/script.js"></script><script>
const profiles={ikirumi:{name:"Ikirumi",file:"Ikirumi.txt",image:"Images/Ikirumi.png",initials:"IK"},jolle:{name:"Jølle",file:"Jolle.txt",image:"Images/Jolle.png",initials:"JØ"},kurs:{name:"Kurs",file:"Kurs.txt",image:"Images/Kurs.png",initials:"KU"}};
const modal=document.getElementById("profileModal"),pn=document.getElementById("profileName"),pc=document.getElementById("profileContribution"),pp=document.getElementById("profilePortrait"),prs=document.getElementById("profileRoles");
const parse=t=>{const o={roles:[]};t.split(/\r?\n/).forEach(line=>{const i=line.indexOf(":");if(i<0)return;const k=line.slice(0,i).trim(),v=line.slice(i+1).trim();if(k==="Name")o.name=v;else if(k==="Description")o.description=v;else if(/^Role [1-5]$/.test(k)&&v)o.roles.push(v);else if(k==="Profile image")o.image=v});return o};
const load=async id=>{const p=profiles[id];try{const d=parse(await(await fetch(p.file,{cache:"no-store"})).text());p.data=d;document.querySelector('[data-role="'+id+'"]').textContent=d.roles.join(" · ");document.querySelector('[data-description="'+id+'"]').textContent=d.description||"";document.querySelector('[data-roles="'+id+'"]').innerHTML=d.roles.map(x=>'<span class="role-slot">'+x+'</span>').join("")}catch(e){}};
Object.keys(profiles).forEach(load);
document.querySelectorAll(".open-profile").forEach(b=>b.addEventListener("click",async()=>{const p=profiles[b.dataset.profile];const d=p.data||parse(await(await fetch(p.file,{cache:"no-store"})).text());pn.textContent=d.name||p.name;pc.textContent=d.description||"";prs.innerHTML=d.roles.map(x=>'<span class="role-slot">'+x+'</span>').join("");pp.innerHTML='<span>'+p.initials+'</span><img src="'+(d.image||p.image)+'" alt="" onerror="this.remove()">';modal.classList.add("open")}));
document.getElementById("closeProfile").onclick=()=>modal.classList.remove("open");modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("open")});
</script></body></html>
